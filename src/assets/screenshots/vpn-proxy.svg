<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Private Tailscale exit node architecture</title>
  <desc id="desc">A neutral network diagram from a trusted remote device through an encrypted Tailnet to a home exit node and the internet.</desc>
  <rect width="1200" height="675" fill="#07131a"/>
  <text x="70" y="92" fill="#ecfeff" font-family="Arial, sans-serif" font-size="38" font-weight="700">PRIVATE TAILSCALE EXIT NODE</text>
  <text x="70" y="132" fill="#5eead4" font-family="Arial, sans-serif" font-size="21">ENCRYPTED ROUTING · POWERSHELL AUTOMATION</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g><rect x="80" y="250" width="245" height="135" rx="20" fill="#11252b" stroke="#22d3ee"/><text x="202" y="305" fill="#fff" font-size="24">Trusted device</text><text x="202" y="342" fill="#a7bec5" font-size="18">remote Windows client</text></g>
    <g><rect x="475" y="250" width="250" height="135" rx="20" fill="#11252b" stroke="#2dd4bf"/><text x="600" y="305" fill="#fff" font-size="24">Encrypted Tailnet</text><text x="600" y="342" fill="#a7bec5" font-size="18">WireGuard transport</text></g>
    <g><rect x="875" y="250" width="245" height="135" rx="20" fill="#11252b" stroke="#34d399"/><text x="997" y="294" fill="#fff" font-size="24">Home exit node</text><text x="997" y="330" fill="#a7bec5" font-size="18">outbound routing</text><text x="997" y="354" fill="#a7bec5" font-size="16">no inbound port forwarding</text></g>
    <path d="M325 317h150m250 0h150" stroke="#5eead4" stroke-width="6" stroke-dasharray="12 10"/>
  </g>
  <text x="70" y="550" fill="#94a3b8" font-family="Arial, sans-serif" font-size="21">No public IP addresses · No device names · No Tailnet identifiers</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Local Hunyuan3D integration architecture</title>
  <desc id="desc">A neutral pipeline diagram from an input image through the upstream Hunyuan3D model, local API, and Blender addon.</desc>
  <rect width="1200" height="675" fill="#0b1020"/>
  <text x="70" y="92" fill="#eef2ff" font-family="Arial, sans-serif" font-size="38" font-weight="700">LOCAL HUNYUAN3D INTEGRATION</text>
  <text x="70" y="132" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="21">DOCKER · GPU · REST API · BLENDER ADDON</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g><rect x="60" y="245" width="230" height="135" rx="20" fill="#171f36" stroke="#60a5fa"/><text x="175" y="302" fill="#fff" font-size="24">Input image</text><text x="175" y="340" fill="#aab6cd" font-size="18">local request</text></g>
    <g><rect x="340" y="245" width="240" height="135" rx="20" fill="#171f36" stroke="#818cf8"/><text x="460" y="292" fill="#fff" font-size="24">Hunyuan3D-2</text><text x="460" y="328" fill="#aab6cd" font-size="18">upstream open model</text><text x="460" y="352" fill="#aab6cd" font-size="16">containerized locally</text></g>
    <g><rect x="630" y="245" width="220" height="135" rx="20" fill="#171f36" stroke="#34d399"/><text x="740" y="302" fill="#fff" font-size="24">Local REST API</text><text x="740" y="340" fill="#aab6cd" font-size="18">generation request</text></g>
    <g><rect x="900" y="245" width="240" height="135" rx="20" fill="#171f36" stroke="#f59e0b"/><text x="1020" y="302" fill="#fff" font-size="24">Blender addon</text><text x="1020" y="340" fill="#aab6cd" font-size="18">import experiment</text></g>
    <path d="M290 312h50m240 0h50m220 0h50" stroke="#64748b" stroke-width="5"/>
  </g>
  <text x="70" y="550" fill="#94a3b8" font-family="Arial, sans-serif" font-size="21">Private integration work · Upstream model credited · No unrelated character artwork</text>
</svg>
